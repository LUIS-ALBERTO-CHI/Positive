<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Notificaciones Push</title>
    <link rel="manifest" href="/manifest.json">
</head>
<body>
    <h1>Prueba de Notificaciones Push</h1>

    <!-- Sección de Autenticación -->
    <div id="auth-section">
        <h2>Iniciar Sesión / Registro</h2>
        <input type="text" id="username" placeholder="Nombre de usuario">
        <input type="password" id="password" placeholder="Contraseña">
        <button id="btn-login">Iniciar Sesión</button>
        <button id="btn-register">Registrarse</button>
    </div>

    <!-- Sección de la App (oculta inicialmente) -->
    <div id="app-section" style="display: none;">
        <h2 id="welcome-message"></h2>
        <button id="btn-subscribe">Suscribirse a Notificaciones</button>
        <button id="btn-send-test">Enviar Notificación de Prueba</button>
    </div>

    <script src="/app.js"></script>
</body>
</html>
